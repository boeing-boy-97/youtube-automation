version: "3.9"

# Production-like compose (single-host). Bring your own Postgres/Redis (managed) in real
# production; this file is for staging and quick prod-like local deploys.

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: runtime
    container_name: shortforge-api
    env_file: ../../apps/api/.env
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      target: runtime
    container_name: shortforge-worker
    env_file: ../../apps/api/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api

  postgres:
    image: postgres:16-alpine
    container_name: shortforge-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-shortforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-shortforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shortforge-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
